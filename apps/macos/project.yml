name: Talkmance
options:
  bundleIdPrefix: com.talkmance
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: 톡맨스
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
    INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Talkmance"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    PRODUCT_NAME: Talkmance
    PRODUCT_BUNDLE_IDENTIFIER: com.talkmance.app
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Talkmance:
    type: application
    platform: macOS
    sources:
      - path: Talkmance
    scheme:
      testTargets: []
    settings:
      base:
        INFOPLIST_KEY_LSUIElement: NO

schemes:
  Talkmance:
    build:
      targets:
        Talkmance: all
    run:
      config: Debug