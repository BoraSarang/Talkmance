name: macOS Release

on:
  push:
    tags: ["v*"]
    paths:
      - "apps/macos/**"
  workflow_dispatch:

jobs:
  build-dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 버전
        run: xcodebuild -version

      - name: Release 빌드 + DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/build-dmg.sh "$VERSION"

      - name: DMG 업로드 (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Talkmance-dmg
          path: apps/macos/dist/Talkmance-*.dmg

      - name: GitHub Release 등록 (태그 시)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/macos/dist/Talkmance-*.dmg